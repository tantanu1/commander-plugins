[package]
name = "commander_s3"
description = "S3 / S3-compatible (MinIO, R2) vfs plugin for Commander (C ABI v1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
commander_plugin_abi = { path = "../abi", features = ["glue"] }
hmac = "0.12"
sha2 = "0.10"
roxmltree = "0.21"
toml = "0.9"
ureq = { version = "3", default-features = false, features = ["rustls"] }
