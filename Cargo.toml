# Generated by tools/export_plugins.sh in the Commander repo: edit there, not here.
[workspace]
members = ["plugins/abi", "plugins/s3", "plugins/ftp", "plugins/sftp", "plugins/smb", "plugins/sevenzip", "plugins/vmware"]
# Standalone SDK example (own Cargo project).
exclude = ["sdk/examples/hello-rust"]
resolver = "3"

[workspace.package]
version = "0.0.33"
edition = "2024"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
